name: Build
on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  RUNNER_UBUNTU: &runner-ubuntu ubuntu-26.04
  RUNNER_UBUNTU_ARM: &runner-ubuntu-arm ubuntu-26.04-arm
  RUNNER_WINDOWS: &runner-windows windows-2025
  RUNNER_MACOS: &runner-macos macos-26
  RUNNER_MACOS_INTEL: &runner-macos-intel macos-26-intel
jobs:
  build:
    name: Build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - *runner-ubuntu
          - *runner-ubuntu-arm
          - *runner-windows
          - *runner-macos
          - *runner-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check for Sonar secret
        id: check-secret
        if: ${{ matrix.os == env.RUNNER_UBUNTU }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "${SONAR_TOKEN}" != '' ]; then
            echo 'is_SONAR_TOKEN_set=true' >> $GITHUB_OUTPUT
          fi
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # gitVersion.mjs needs the complete history to calculate the commit
          # count since the latest tag. This also improves SonarCloud analysis.
          fetch-depth: 0
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
          key: ${{ matrix.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/pluginLibs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Cache Sonar packages
        uses: actions/cache@v5
        if: ${{ steps.check-secret.outputs.is_SONAR_TOKEN_set }}
        with:
          path: |
            ~/.sonar/cache
          key: ${{ matrix.os }}-sonar-${{ hashFiles('gradle/pluginLibs.versions.toml') }}
      - name: Cache node distribution
        uses: actions/cache@v5
        with:
          path: |
            .node
          key: ${{ matrix.os }}-node-${{ hashFiles('gradle.properties') }}
      - name: Cache yarn packages
        uses: actions/cache@v5
        with:
          path: |
           .yarn/cache
          key: ${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: |
           .playwright
          key: ${{ matrix.os }}-playwright-${{ hashFiles('yarn.lock') }}
      - name: Install Linux build dependencies
        if: ${{ matrix.os == env.RUNNER_UBUNTU || matrix.os == env.RUNNER_UBUNTU_ARM }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools xvfb
      - name: Gradle build
        env:
          # Deterministically exercise the Xvfb fallback in the electron
          # e2e tests on Linux, instead of relying on the runner happening
          # not to have a display. Harmless no-op on macOS/Windows.
          DISPLAY: ''
          WAYLAND_DISPLAY: ''
        run: |
          ./gradlew build -Pci --info --stacktrace --max-workers 2 --no-daemon
      - name: Upload snapshot diff artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs-${{ matrix.os }}
          path: subprojects/electron/e2e/__diffs__/
          if-no-files-found: ignore
          retention-days: 5
      - name: Sonar analyze
        if: ${{ steps.check-secret.outputs.is_SONAR_TOKEN_set }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed by Sonar to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar -Pci --info --stacktrace --max-workers 2 --no-daemon
      - name: Upload application artifacts
        if: ${{ matrix.os == env.RUNNER_UBUNTU }}
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            subprojects/**/build/distributions/*.tar
            subprojects/chat/build/esbuild/production/index.mjs
            subprojects/frontend/build/vite/production/**/*
          compression-level: 0
          retention-days: 5  # No need to preserve for long, since they are uploaded to GHCR
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            subprojects/electron/build/dist/*.AppImage
            subprojects/electron/build/dist/*.deb
            subprojects/electron/build/dist/*.rpm
            subprojects/electron/build/dist/*.pkg.tar.xz
            subprojects/electron/build/dist/*.exe
            subprojects/electron/build/dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
      - name: Build signed Maven repository
        if: ${{ matrix.os == env.RUNNER_UBUNTU && github.event_name == 'push' && github.repository_owner == 'graphs4value' }}
        env:
          PGP_KEY: ${{ secrets.PGP_KEY }}
          PGP_KEY_ID: ${{ secrets.PGP_KEY_ID }}
          PGP_PASSWORD: ${{ secrets.PGP_PASSWORD }}
        run: |
          ./gradlew mavenRepository -Pci -PforceSign --info --stacktrace --max-workers 2 --no-daemon
      - name: Build unsigned Maven repository
        if: ${{ matrix.os == env.RUNNER_UBUNTU && (github.event_name != 'push' || github.repository_owner != 'graphs4value') }}
        run: |
          ./gradlew mavenRepository -Pci --info --stacktrace --max-workers 2 --no-daemon
      - name: Merge Maven repository with site
        if: ${{ matrix.os == env.RUNNER_UBUNTU }}
        run: |
          mkdir -p subprojects/docs/build/docusaurus/maven
          mv build/repo subprojects/docs/build/docusaurus/maven/snapshots
      - name: Upload GithHub Pages artifact
        if: ${{ matrix.os == env.RUNNER_UBUNTU }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: subprojects/docs/build/docusaurus/
          retention-days: 90
  reuse-check:
    name: REUSE Compliance Check
    permissions:
      contents: read
    runs-on: *runner-ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5
        with:
          args: --include-meson-subprojects lint
  publish-site:
    name: Publish to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.repository == 'graphs4value/refinery' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: *runner-ubuntu
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  docker-build:
    name: Build Docker images
    needs: build
    permissions:
      packages: write
      contents: read
    runs-on: *runner-ubuntu
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          platforms: linux/amd64,linux/arm64
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download application artifacts
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: subprojects
      - name: Extract application artifacts
        working-directory: ./docker
        run: |
          ./prepare_context.sh
      - name: Bake images
        working-directory: ./docker
        run: |
          ./bake.sh false --set '*.cache-from=gha' --set '*.cache-to=type=gha,mode=max'
      - name: Log in to GitHub Container registry
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.repository == 'graphs4value/refinery' }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload images to GitHub Container registry
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.repository == 'graphs4value/refinery' }}
        working-directory: ./docker
        run: |
          ./bake.sh true --set '*.cache-from=gha' --set '*.cache-to=type=gha,mode=max'
      - name: Delete application artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: distributions
  deploy:
    name: Deploy to server
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.repository == 'graphs4value/refinery' }}
    needs: docker-build
    permissions: {}
    runs-on: *runner-ubuntu
    environment:
      name: production
      url: https://refinery.services
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy to server
        env:
          KNOWN_HOSTS: ${{ vars.KNOWN_HOSTS }}
        run: |
          echo "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          ssh refinery@refinery.services /var/lib/refinery/deploy.sh
  publish-snapshot:
    name: Publish snapshot release
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.repository == 'graphs4value/refinery' }}
    needs:
      - build
      - publish-site
      - docker-build
    permissions:
      contents: write
    runs-on: *runner-ubuntu
    steps:
      - name: Check out commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Read Docker snapshot tag
        id: docker-version
        run: echo "tag=$(./docker/get_version.sh version)" >> "$GITHUB_OUTPUT"
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Move snapshot tag
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force snapshot "${GITHUB_SHA}"
          git push --force origin refs/tags/snapshot
      - name: Remove previous snapshot assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/remove_github_release_assets.sh snapshot
      - name: Publish snapshot release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: snapshot
          target_commitish: ${{ github.sha }}
          name: Refinery snapshot
          body: |
            <p>Snapshot built from <code>${{ github.sha }}</code> on <code>main</code>.</p>
            <h2>Snapshot Maven repository</h2>
            <p>
              Use the <a href="https://refinery.tools/maven/snapshots/">Refinery snapshot Maven repository</a>
              for snapshot Java dependencies, following the
              <a href="https://refinery.tools/snapshot/develop/java/">Java snapshot usage instructions</a>.
            </p>
            <p>Repository URL: <code>https://refinery.tools/maven/snapshots/</code></p>
            <h2>Docker images</h2>
            <ul>
              <li>
                <a href="https://github.com/graphs4value/refinery/pkgs/container/refinery">Refinery web/server</a>
                (<code>ghcr.io/graphs4value/refinery:${{ steps.docker-version.outputs.tag }}</code>)
              </li>
              <li>
                <a href="https://github.com/graphs4value/refinery/pkgs/container/refinery-cli">Refinery CLI</a>
                (<code>ghcr.io/graphs4value/refinery-cli:${{ steps.docker-version.outputs.tag }}</code>)
              </li>
              <li>
                <a href="https://github.com/graphs4value/refinery/pkgs/container/refinery-chat">Refinery Chat</a>
                (<code>ghcr.io/graphs4value/refinery-chat:${{ steps.docker-version.outputs.tag }}</code>)
              </li>
            </ul>
            <p>Pull an image with <code>docker pull ghcr.io/graphs4value/refinery:${{ steps.docker-version.outputs.tag }}</code>, replacing the image name as needed.</p>
          prerelease: true
          make_latest: false
          files: release-artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
